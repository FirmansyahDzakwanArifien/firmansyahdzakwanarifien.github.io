<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 271 442" width="271" height="442">
  <title>A rack with a firewall, switch, and Linux servers, topped by a SIEM screen showing an SSH brute-force alert</title>
  <defs>
    <style>
      .ink { stroke: #14141c; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #14141c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .shadow { fill: #2563eb; }
      .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-weight: 700; }
      .sans { font-family: system-ui, 'Segoe UI', Arial, sans-serif; font-weight: 800; }
    </style>
    <!-- White sticker rim so the ink outline still reads on the dark theme -->
    <filter id="rim" x="-5%" y="-5%" width="110%" height="110%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3.5" result="grown"/>
      <feFlood flood-color="#ffffff"/>
      <feComposite in2="grown" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#rim)">

  <!-- Network nodes reaching the SIEM -->
  <path class="thin" d="M30 92 L52 40 L84 70 M30 92 L70 118" fill="none"/>
  <circle class="shadow" cx="35" cy="97" r="11"/>
  <circle class="ink" cx="30" cy="92" r="11" fill="#0f8c78"/>
  <circle class="shadow" cx="57" cy="45" r="9"/>
  <circle class="ink" cx="52" cy="40" r="9" fill="#f5f6f8"/>

  <!-- Rack cabinet -->
  <rect class="shadow" x="58" y="182" width="208" height="252" rx="10"/>
  <rect class="ink" x="50" y="174" width="208" height="252" rx="10" fill="#1f2937"/>

  <!-- Firewall (1U) -->
  <rect class="thin" x="62" y="186" width="188" height="34" rx="5" fill="#2b3445"/>
  <rect class="thin" x="62" y="186" width="40" height="34" rx="5" fill="#ea580c"/>
  <text class="sans" x="82" y="208" font-size="12" fill="#ffffff" text-anchor="middle">FW</text>
  <g fill="#0f172a" stroke="#14141c" stroke-width="1.5">
    <rect x="112" y="196" width="12" height="14" rx="2"/><rect x="129" y="196" width="12" height="14" rx="2"/>
    <rect x="146" y="196" width="12" height="14" rx="2"/><rect x="163" y="196" width="12" height="14" rx="2"/>
    <rect x="180" y="196" width="12" height="14" rx="2"/><rect x="197" y="196" width="12" height="14" rx="2"/>
  </g>
  <g fill="#22c55e"><circle cx="118" cy="192" r="2"/><circle cx="135" cy="192" r="2"/><circle cx="152" cy="192" r="2"/><circle cx="186" cy="192" r="2"/></g>
  <circle cx="235" cy="203" r="5" fill="#22c55e" stroke="#14141c" stroke-width="1.5"/>

  <!-- Switch (1U) -->
  <rect class="thin" x="62" y="228" width="188" height="30" rx="5" fill="#3d4a61"/>
  <g fill="#0f172a" stroke="#14141c" stroke-width="1.5">
    <rect x="72" y="236" width="10" height="12" rx="2"/><rect x="86" y="236" width="10" height="12" rx="2"/>
    <rect x="100" y="236" width="10" height="12" rx="2"/><rect x="114" y="236" width="10" height="12" rx="2"/>
    <rect x="128" y="236" width="10" height="12" rx="2"/><rect x="142" y="236" width="10" height="12" rx="2"/>
    <rect x="156" y="236" width="10" height="12" rx="2"/><rect x="170" y="236" width="10" height="12" rx="2"/>
    <rect x="184" y="236" width="10" height="12" rx="2"/><rect x="198" y="236" width="10" height="12" rx="2"/>
    <rect x="212" y="236" width="10" height="12" rx="2"/><rect x="226" y="236" width="10" height="12" rx="2"/>
  </g>
  <!-- Patch cables from the firewall to the switch -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M118 210 C118 226 91 222 91 242" stroke="#facc15"/>
    <path d="M135 210 C135 228 133 222 133 242" stroke="#60a5fa"/>
    <path d="M152 210 C154 228 175 222 175 242" stroke="#22c55e"/>
  </g>

  <!-- Linux servers (2U each) -->
  <g>
    <rect class="thin" x="62" y="266" width="188" height="44" rx="5" fill="#2b3445"/>
    <rect class="thin" x="62" y="318" width="188" height="44" rx="5" fill="#2b3445"/>
    <rect class="thin" x="62" y="370" width="188" height="44" rx="5" fill="#2b3445"/>
    <g fill="#22c55e"><circle cx="78" cy="288" r="4.5"/><circle cx="78" cy="340" r="4.5"/><circle cx="78" cy="392" r="4.5"/></g>
    <g fill="#7aa7ff"><circle cx="93" cy="288" r="3.5"/><circle cx="93" cy="392" r="3.5"/></g>
    <circle cx="93" cy="340" r="3.5" fill="#f59e0b"/>
    <g stroke="#14141c" stroke-width="3" stroke-linecap="round">
      <path d="M150 279 v18 M160 279 v18 M170 279 v18 M180 279 v18 M190 279 v18 M200 279 v18 M210 279 v18 M220 279 v18 M230 279 v18"/>
      <path d="M150 331 v18 M160 331 v18 M170 331 v18 M180 331 v18 M190 331 v18 M200 331 v18 M210 331 v18 M220 331 v18 M230 331 v18"/>
      <path d="M150 383 v18 M160 383 v18 M170 383 v18 M180 383 v18 M190 383 v18 M200 383 v18 M210 383 v18 M220 383 v18 M230 383 v18"/>
    </g>
    <text class="mono" x="106" y="292" font-size="10" fill="#cbd5e1">srv</text>
    <text class="mono" x="106" y="344" font-size="10" fill="#cbd5e1">srv</text>
    <text class="mono" x="106" y="396" font-size="10" fill="#cbd5e1">srv</text>
  </g>

  <!-- SIEM screen on top of the rack -->
  <rect class="shadow" x="78" y="20" width="190" height="134" rx="10"/>
  <rect class="ink" x="70" y="12" width="190" height="134" rx="10" fill="#0f172a"/>
  <rect class="ink" x="150" y="146" width="30" height="16" fill="#3d4a61"/>
  <rect class="ink" x="124" y="160" width="82" height="10" rx="4" fill="#3d4a61"/>
  <path class="thin" d="M72 34 H258" fill="none"/>
  <circle cx="82" cy="23" r="3.5" fill="#ef4444"/>
  <circle cx="93" cy="23" r="3.5" fill="#f59e0b"/>
  <circle cx="104" cy="23" r="3.5" fill="#22c55e"/>
  <text class="mono" x="252" y="27" font-size="9" fill="#94a3b8" text-anchor="end">SIEM</text>
  <!-- Alerts per hour, with a spike -->
  <path d="M82 104 H150" stroke="#475569" stroke-width="2"/>
  <g fill="#3b82f6">
    <rect x="84" y="88" width="9" height="16" rx="1.5"/><rect x="97" y="82" width="9" height="22" rx="1.5"/>
    <rect x="110" y="90" width="9" height="14" rx="1.5"/><rect x="136" y="86" width="9" height="18" rx="1.5"/>
  </g>
  <rect x="123" y="48" width="9" height="56" rx="1.5" fill="#ef4444"/>
  <!-- Alert card -->
  <rect x="158" y="44" width="92" height="60" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <rect x="165" y="51" width="42" height="14" rx="7" fill="#ef4444"/>
  <text class="sans" x="186" y="61.5" font-size="8.5" fill="#ffffff" text-anchor="middle">ALERT</text>
  <text class="mono" x="165" y="80" font-size="9" fill="#f5f6f8">rule 5712</text>
  <text class="mono" x="165" y="95" font-size="8" fill="#fca5a5">ssh brute force</text>
  <!-- Response in the terminal -->
  <text class="mono" x="82" y="128" font-size="10" fill="#22c55e">$ ufw deny from &lt;ip&gt;</text>
  <rect x="234" y="119" width="7" height="11" fill="#f5f6f8"/>

  <!-- Shield with a lock, guarding the rack -->
  <path class="shadow" d="M54 290 L98 306 V352 C98 384 78 404 54 414 C30 404 10 384 10 352 V306 Z"/>
  <path class="ink" d="M48 284 L92 300 V346 C92 378 72 398 48 408 C24 398 4 378 4 346 V300 Z" fill="#2563eb"/>
  <path d="M48 297 L81 309 V345 C81 370 66 386 48 395 Z" fill="#3b7bff" opacity="0.6"/>
  <rect class="ink" x="31" y="336" width="34" height="28" rx="5" fill="#f5f6f8" stroke-width="3.5"/>
  <path class="ink" d="M38 336 V326 a10 10 0 0 1 20 0 V336" fill="none" stroke-width="3.5"/>
  <circle cx="48" cy="348" r="4" fill="#14141c"/>
  <path d="M48 350 v6" stroke="#14141c" stroke-width="3" stroke-linecap="round"/>

  </g>
</svg>
