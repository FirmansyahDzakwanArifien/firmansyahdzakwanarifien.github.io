<!-- Terminal intro: types a short boot sequence, then fades into the page. Shown once per session. -->

<div id="intro" role="dialog" aria-label="Intro" aria-modal="true" style="display: none">
  <button type="button" class="intro-skip" data-intro-skip>Skip</button>

  <div class="intro-term">
    <div class="intro-term-bar">
      <i></i><i></i><i></i>
      <span>{{ site.title | strip | downcase }}@portfolio: ~</span>
    </div>
    <div class="intro-term-body">
      <p class="intro-line"><span class="intro-prompt">$</span><span data-type>whoami</span></p>
      <p class="intro-line intro-out">{{ site.social.name | slugify }}</p>
      <p class="intro-line"><span class="intro-prompt">$</span><span data-type>load --profile</span></p>
      <p class="intro-line intro-out"><span class="intro-ok">[ ok ]</span> security</p>
      <p class="intro-line intro-out"><span class="intro-ok">[ ok ]</span> infrastructure</p>
      <p class="intro-line intro-out"><span class="intro-ok">[ ok ]</span> devops</p>
      <p class="intro-line intro-granted">&gt; access granted<span class="intro-cursor"></span></p>
    </div>
  </div>
</div>

<script>
  (function () {
    var root = document.getElementById('intro');
    if (!root) { return; }

    var KEY = 'intro-seen';
    var seen = false;
    try { seen = sessionStorage.getItem(KEY) === '1'; } catch (e) {}

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var styled = window.getComputedStyle(root).position === 'fixed';
    if (seen || reduced || !styled) { root.remove(); return; }

    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}

    var html = document.documentElement;
    var lines = root.querySelectorAll('.intro-line');
    var timers = [];
    var done = false;

    root.style.display = '';
    html.classList.add('intro-lock');

    function later(fn, ms) { timers.push(window.setTimeout(fn, ms)); }

    function finish() {
      if (done) { return; }
      done = true;
      timers.forEach(window.clearTimeout);
      root.classList.add('is-done');
      html.classList.remove('intro-lock');
      later(function () { root.remove(); }, 600);
      ['keydown', 'wheel', 'touchstart'].forEach(function (type) {
        window.removeEventListener(type, finish);
      });
    }

    /* Reveal lines one by one; commands are typed out character by character. */
    function show(i) {
      if (i >= lines.length) { later(finish, 650); return; }
      var line = lines[i];
      var typed = line.querySelector('[data-type]');
      line.classList.add('is-on');
      if (!typed) { later(function () { show(i + 1); }, 160); return; }
      var text = typed.textContent;
      var n = 0;
      typed.textContent = '';
      (function type() {
        typed.textContent = text.slice(0, ++n);
        if (n < text.length) { later(type, 38); } else { later(function () { show(i + 1); }, 220); }
      })();
    }

    root.addEventListener('click', finish);
    ['keydown', 'wheel', 'touchstart'].forEach(function (type) {
      window.addEventListener(type, finish, { passive: true });
    });

    later(function () { show(0); }, 250);
  })();
</script>
