<!-- Terminal intro: types a short boot sequence, then fades into the page. Shown once per session. -->

<div id="intro" role="dialog" aria-label="Intro" aria-modal="true" style="display: none">
  <button type="button" class="intro-skip" data-intro-skip>Skip</button>

  <div class="intro-term">
    <div class="intro-term-bar">
      <i></i><i></i><i></i>
      <span>{{ site.title | strip | downcase }}@portfolio: ~</span>
    </div>
    <div class="intro-term-body">
      <p class="intro-line"><span class="intro-prompt">$</span><span data-type>whoami</span></p>
      <p class="intro-line intro-out">{{ site.social.name | slugify }}</p>
      <p class="intro-line"><span class="intro-prompt">$</span><span data-type>load --profile</span></p>
      <p class="intro-line intro-out"><span class="intro-ok">[ ok ]</span> security</p>
      <p class="intro-line intro-out"><span class="intro-ok">[ ok ]</span> infrastructure</p>
      <p class="intro-line intro-out"><span class="intro-ok">[ ok ]</span> devops</p>
      <p class="intro-line intro-granted">&gt; access granted<span class="intro-cursor"></span></p>
    </div>
  </div>
</div>

<script src="{{ '/assets/js/custom/intro.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
