bio: >-
  Implementation Engineer at PT Jarvis Integrasi Solusi, focused on cybersecurity, network infrastructure,
  and system administration. I deploy, secure, and troubleshoot enterprise infrastructure: network and
  security appliances (Fortinet NSE 1–5 certified), Linux servers, virtualization, cloud, monitoring, and
  incident response. On the research side, I work on User and Entity Behavior Analytics (UEBA) with Machine
  Learning and Explainable AI for insider threat detection, and I give back to the community through open
  source and knowledge sharing.

next: >-
  Growing as a security professional who bridges infrastructure, operations, and security strategy.
  Next up: deeper hands-on work with enterprise security platforms, sharper penetration testing skills,
  and DevSecOps practices built into the deployment pipeline. Alongside that, staying active in the
  community through open source, mentoring, and CTF competitions.

