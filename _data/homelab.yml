# Homelab section of /labs/ (_includes/homelab.html): the isolated testbed of my undergraduate thesis.
# Full instructions: docs/GUIDE.md, section "Homelab". Never put IPs, hostnames, ports, or credentials here:
# this page is public.
#
# canvas: [width, height] of the diagram. Each node needs a unique id and x/y for its centre.
# icon: one of the glyph names in assets/js/custom/homelab.js (server, eye, brain, laptop, ...).
# principles use full Font Awesome classes (fas fa-...) so tools/fa-subset.py picks them up.
# zone colours the node: edge | security | compute | monitor | client
# links: from/to node ids, optional label, optional dashed: true (on-demand connections), optional both: true.
# boundaries: dashed frames fitted around a list of node ids. Visitors can drag nodes on the page; that
# layout stays in their browser only, so the positions here remain the published default.

title: Thesis testbed
summary: >-
  The isolated lab behind my undergraduate thesis on automating security incident classification with
  n8n and a self-hosted LLM. Alerts from Wazuh and Suricata flow through a normalization and rule-based
  filtering pipeline; only significant alerts reach the LLM, which drafts a classification and mitigation
  steps for a human analyst.

# Key numbers shown above the diagram.
facts:
  - value: "6"
    label: VMs on Proxmox
  - value: "5"
    label: pipeline layers
  - value: "2"
    label: LLM candidates
  - value: "0"
    label: public IPs

# Thesis timeline. status: done | in-progress | planned. The first in-progress stage is shown as the
# current status at the top of the section. when: free text (e.g. "Oct 2026"), optional.
progress:
  - stage: Proposal and testbed design
    status: in-progress
    text: Research questions, architecture, and the isolated Proxmox testbed design.
  - stage: Testbed build
    status: planned
    text: Gateway, detection VM, targets, LibreNMS, n8n with PostgreSQL, and Ollama brought up in the lab.
  - stage: Attack scenarios and ground truth
    status: planned
    text: Scripted attacks from the researcher laptop over the VPN, each labelled with its expected category and severity.
  - stage: Pipeline and data collection
    status: planned
    text: Normalization, rule-based filtering, and LLM inference running end to end; every incident stored in PostgreSQL.
  - stage: Evaluation
    status: planned
    text: LLM output compared against the ground-truth labels for each candidate model.
  - stage: Thesis defense
    status: planned

# Evaluation results per model. Leave a value empty until it is measured; the table then shows
# "pending". best: higher | lower marks the better value in each row once both are filled in.
results:
  models: [Llama 3 8B, Mistral 7B]
  metrics:
    - name: Category accuracy
      unit: "%"
      best: higher
      note: Share of incidents whose predicted category matches the ground truth.
      values: [~, ~]
    - name: Macro F1 (category)
      best: higher
      note: Balances precision and recall across all incident categories.
      values: [~, ~]
    - name: Severity agreement
      unit: "%"
      best: higher
      note: Share of incidents where the model's severity matches the scenario label.
      values: [~, ~]
    - name: Valid JSON output
      unit: "%"
      best: higher
      note: Responses that parse and follow the output schema without retries.
      values: [~, ~]
    - name: Median inference time
      unit: s
      best: lower
      note: Per significant alert, measured on the Ollama VM.
      values: [~, ~]
  # Pipeline-wide numbers (not per model).
  pipeline:
    - name: Alerts filtered before the LLM
      unit: "%"
      note: Low-severity alerts archived by the rule-based filter.
      value: ~

canvas: [1012, 520]

# Dashed frames around groups of nodes. Each frame is fitted around its nodes (node box + pad, with
# extra room at the bottom for the label), so it follows when a node is dragged on the page.
# style: cluster (outer frame) | segment (network segment inside the cluster). List outer frames first.
boundaries:
  - label: Proxmox cluster · isolated, no public IP
    style: cluster
    nodes: [gateway, targets, librenms, detection, n8n, ollama]
    pad: 32
    bottom: 64
  - label: Target segment
    style: segment
    nodes: [targets]
    pad: 16
    bottom: 34
  - label: Management
    style: segment
    nodes: [librenms]
    pad: 16
    bottom: 34
  - label: SOC segment · detection and pipeline
    style: segment
    nodes: [detection, n8n, ollama]
    pad: 16
    bottom: 34

nodes:
  - id: laptop
    label: Researcher
    icon: laptop
    zone: client
    x: 90
    y: 100
    role: Attack simulation and lab access
    details:
      - Runs the scripted attack scenarios over the VPN, so no separate attacker VM is needed
      - Each run gets a scenario ID and its expected category and severity before it starts (ground truth)
      - Attack traffic still passes the gateway, where it is mirrored to Suricata
  - id: gateway
    label: Gateway
    icon: shield-halved
    zone: security
    x: 350
    y: 100
    role: pfSense / OPNsense · routing between segments
    details:
      - Single controlled entry point; VPN enabled only for an experiment session
      - Default deny between segments; targets may only reach the Wazuh manager, never n8n or Ollama
      - No internet egress for the lab during a session; models and updates are pulled beforehand
      - Mirrors target-segment traffic to Suricata and serves NTP so every log uses the same clock
  - id: targets
    label: Target VMs
    icon: server
    zone: compute
    x: 620
    y: 100
    role: One to two Linux targets of the simulated attacks
    details:
      - Treated as untrusted, since they are the systems being attacked
      - Wazuh agent ships host logs to the detection VM
      - Snapshot before each scenario and roll back after it, so every run starts from the same state
  - id: librenms
    label: LibreNMS
    icon: chart-line
    zone: monitor
    x: 890
    y: 100
    role: Lab infrastructure monitoring (management segment)
    details:
      - Dedicated lab instance, separate from the production LibreNMS
      - Watches CPU, memory, and disk of the lab VMs, so a slow inference can be told apart from a busy host
  - id: detection
    label: Wazuh + Suricata
    icon: eye
    zone: security
    x: 350
    y: 280
    role: Detection VM (host and network)
    details:
      - Wazuh Manager raises rule-based alerts from agent logs (JSON)
      - Suricata inspects mirrored traffic; its eve.json alerts are read by Wazuh on the same VM
      - One Wazuh integration forwards both sources to n8n over a webhook with a secret token
      - Combined on one VM to save resources; can be split if CPU or storage becomes a bottleneck
  - id: n8n
    label: n8n + Postgres
    icon: diagram-project
    zone: compute
    x: 620
    y: 280
    role: Pipeline VM 1 · orchestration and storage (Docker)
    details:
      - Authenticated webhook intake, normalization to one schema, and deduplication
      - Sigma-style rule filtering; only significant incidents go to the LLM
      - Validates every LLM answer against the output schema before anything is sent
      - PostgreSQL stores raw and normalized alerts, the LLM output, prompt version, model, latency, and the analyst verdict
  - id: ollama
    label: Ollama LLM
    icon: brain
    zone: compute
    x: 890
    y: 280
    role: Pipeline VM 2 · LLM inference
    details:
      - Open-source models (candidates Llama 3 8B, Mistral 7B), pinned to an exact version
      - Structured output with a JSON schema, temperature 0, and a fixed seed
      - No tools and no network access beyond n8n; it can only return text
      - Kept apart from n8n so heavy inference does not slow orchestration
  - id: analyst
    label: Analyst
    icon: bell
    zone: client
    x: 620
    y: 470
    role: Slack or email notification and review
    details:
      - Receives the recommendation; nothing is executed on the targets automatically
      - Accepts or corrects the category and severity; the verdict is stored with the incident

