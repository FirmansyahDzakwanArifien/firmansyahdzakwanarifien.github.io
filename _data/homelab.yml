# The five pipeline layers, in order.
layers:
  - name: Data sources
    tools: Wazuh · Suricata
    text: Wazuh watches the target hosts through agents and raises rule-based alerts in JSON; Suricata inspects traffic mirrored from the gateway with intrusion detection rules.
  - name: Intake and normalization
    tools: n8n webhook · JavaScript
    text: Wazuh and Suricata alerts have different field schemas, so each one is mapped to a single JSON schema. This step is deterministic code, not an LLM, so results are consistent and repeatable across experiment sessions.
  - name: Rule-based filtering
    tools: Sigma-style rules in n8n
    text: Each normalized alert gets a severity. Low-severity alerts are archived straight to PostgreSQL; only alerts above the threshold continue, which cuts LLM load and speeds up the whole pipeline.
  - name: LLM inference
    tools: Ollama · Llama 3 8B / Mistral 7B
    text: Significant alerts are sent to Ollama with a structured prompt. The model returns structured JSON with the incident category, severity, a short narrative, and suggested mitigation steps, using a low temperature and a fixed seed to limit run-to-run variation.
  - name: Output and records
    tools: Slack / email · PostgreSQL
    text: Recommendations go to the analyst without any automated action on the targets. Every incident, whether processed by the LLM or archived by the filter, is stored with the ground-truth label from the scenario for offline evaluation.

# Design decisions worth calling out.
principles:
  - icon: fas fa-lock
    title: Isolated by design
    text: No public IPs; the only way in is a VPN that is switched on for an experiment session and off afterwards.
  - icon: fas fa-code
    title: Deterministic where it matters
    text: Normalization and filtering are plain code, so the LLM only sees clean, already-triaged alerts.
  - icon: fas fa-filter
    title: LLM only when needed
    text: Rule-based filtering keeps low-severity noise away from the model and keeps the pipeline fast.
  - icon: fas fa-user-shield
    title: Human in the loop
    text: The system recommends; the analyst decides. Nothing is executed on the target systems.

# One alert followed through the pipeline (Pipeline tab). Illustrative: it shows the shape of the data at
# each step, not a measured result. Keep it masked: placeholders instead of real IPs or hostnames.
example:
  title: "One alert, three steps: an SSH brute force on a target VM"
  note: Illustrative data that shows the shape of each step, with addresses masked. Not an evaluation result.
  steps:
    - name: Raw Wazuh alert
      layer: Data sources
      code: |
        {
          "timestamp": "2026-10-21T09:14:07.512+0700",
          "rule": {
            "id": "5712",
            "level": 10,
            "description": "sshd: brute force trying to get access to the system. Non existent user.",
            "frequency": 8,
            "groups": ["syslog", "sshd", "authentication_failures"],
            "mitre": { "id": ["T1110"], "tactic": ["Credential Access"] }
          },
          "agent": { "id": "002", "name": "target-01" },
          "data": { "srcip": "<attacker-ip>", "srcuser": "admin" },
          "full_log": "sshd[2231]: Invalid user admin from <attacker-ip> port 51644"
        }
    - name: Normalized and filtered
      layer: n8n · JavaScript + rules
      code: |
        {
          "source": "wazuh",
          "event_time": "2026-10-21T02:14:07Z",
          "host": "target-01",
          "rule_id": "5712",
          "signature": "SSH brute force, non-existent user",
          "severity": "high",
          "src_ip": "<attacker-ip>",
          "user": "admin",
          "count": 8,
          "mitre": ["T1110"],
          "route": "llm"
        }
    - name: LLM recommendation
      layer: Ollama · structured JSON
      code: |
        {
          "category": "Credential Access: Brute Force",
          "severity": "high",
          "summary": "Eight failed SSH logins for a non-existent user from one source on target-01 within a short window, consistent with password guessing.",
          "mitigation": [
            "Block the source address at the gateway for this session",
            "Check the auth log for any successful login from that source",
            "Disable SSH password login and allow keys only",
            "Rate-limit sshd (e.g. fail2ban)"
          ],
          "needs_analyst": true
        }

