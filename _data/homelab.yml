    both: true
  - from: n8n
    to: analyst
    label: recommendation / verdict
    both: true

# The five pipeline layers, in order.
layers:
  - name: Data sources
    tools: Wazuh · Suricata · NTP
    text: Wazuh watches the target hosts through agents and raises rule-based alerts in JSON; Suricata inspects traffic mirrored from the gateway, and Wazuh reads its eve.json, so both sources leave the detection VM through one integration. Every VM takes its time from the gateway, so host and network events line up.
  - name: Intake and normalization
    tools: n8n webhook · JavaScript
    text: The webhook only accepts requests that carry the shared secret. Wazuh and Suricata fields are mapped to a single JSON schema with UTC timestamps, and the raw alert is kept next to the normalized one. This step is deterministic code, not an LLM, so it is consistent and repeatable across sessions.
  - name: Triage and deduplication
    tools: Sigma-style rules in n8n
    text: Repeats of the same rule, host, and source within a short window are grouped into one incident, so the model sees one brute force instead of fifty alerts. Each incident gets a severity; low-severity ones are archived straight to PostgreSQL and only those above the threshold continue, which cuts LLM load.
  - name: LLM inference and validation
    tools: Ollama · Llama 3 8B / Mistral 7B
    text: The prompt is versioned and puts alert fields inside a clearly marked data block, because usernames, URLs, and payloads come from the attacker and may try to steer the model. Ollama returns JSON constrained by a schema, at temperature 0 with a fixed seed. n8n then checks the answer (valid JSON, category from a fixed list); after one failed retry the incident falls back to manual triage with its rule-based severity.
  - name: Review, records, and evaluation
    tools: Slack / email · PostgreSQL
    text: The analyst receives the recommendation and records a verdict; nothing runs on the targets automatically. Every incident is stored with its prompt version, model, and latency. Ground-truth labels live in a separate table and never enter the prompt, and the same recorded alerts are replayed to each model, so both are compared on identical input.

# Design decisions worth calling out.
principles:
  - icon: fas fa-lock
    title: Isolated and segmented
    text: No public IPs and a VPN that is on only during a session. Targets, the SOC pipeline, and management sit in separate segments with default-deny rules between them.
  - icon: fas fa-code
    title: Deterministic where it matters
    text: Normalization, deduplication, and filtering are plain code, so the LLM only sees clean, already-triaged incidents.
  - icon: fas fa-filter
    title: LLM only when needed
    text: Rule-based triage keeps low-severity noise away from the model and keeps the pipeline fast.
  - icon: fas fa-user-secret
    title: Alert data is untrusted
    text: Attacker-controlled fields are passed as data, never as instructions, and the model has no tools, so a crafted log line cannot make it act.
  - icon: fas fa-circle-check
    title: Validate every answer
    text: Output must match the JSON schema and a fixed category list; anything else is retried once and then handed to a human.
  - icon: fas fa-user-shield
    title: Human in the loop
    text: The system recommends and the analyst decides. That verdict is stored, which shows how often the model was right.
  - icon: fas fa-flask
    title: Fair, reproducible evaluation
    text: Pinned model versions, a versioned prompt, a VM snapshot per scenario, and one recorded alert set replayed to every model.

# One alert followed through the pipeline (Pipeline tab). Illustrative: it shows the shape of the data at
# each step, not a measured result. Keep it masked: placeholders instead of real IPs or hostnames.
example:
  title: "One alert, four steps: an SSH brute force on a target VM"
  note: Illustrative data that shows the shape of each step, with addresses masked. Not an evaluation result.
  steps:
    - name: Raw Wazuh alert
      layer: Data sources
      code: |
        {
          "timestamp": "2026-10-21T09:14:07.512+0700",
          "rule": {
            "id": "5712",
            "level": 10,
            "description": "sshd: brute force trying to get access to the system. Non existent user.",
            "frequency": 8,
            "groups": ["syslog", "sshd", "authentication_failures"],
            "mitre": { "id": ["T1110"], "tactic": ["Credential Access"] }
          },
          "agent": { "id": "002", "name": "target-01" },
          "data": { "srcip": "<attacker-ip>", "srcuser": "admin" },
          "full_log": "sshd[2231]: Invalid user admin from <attacker-ip> port 51644"
        }
    - name: Normalized, deduplicated, triaged
      layer: n8n · JavaScript + rules
      code: |
        {
          "incident_id": "inc-0142",
          "scenario_id": "S03-ssh-bruteforce-r2",
          "source": "wazuh",
          "event_time": "2026-10-21T02:14:07Z",
          "host": "target-01",
          "rule_id": "5712",
          "signature": "SSH brute force, non-existent user",
          "severity": "high",
          "src_ip": "<attacker-ip>",
          "user": "admin",
          "alert_count": 8,
          "fingerprint": "5712|target-01|<attacker-ip>",
          "mitre": ["T1110"],
          "route": "llm"
        }
    - name: LLM recommendation
      layer: Ollama · schema-constrained JSON
      code: |
        {
          "category": "Credential Access: Brute Force",
          "severity": "high",
          "summary": "Eight failed SSH logins for a non-existent user from one source on target-01 within a short window, consistent with password guessing.",
          "mitigation": [
            "Block the source address at the gateway for this session",
            "Check the auth log for any successful login from that source",
            "Disable SSH password login and allow keys only",
            "Rate-limit sshd (e.g. fail2ban)"
          ],
          "needs_analyst": true
        }
    - name: Validated and recorded
      layer: n8n · PostgreSQL
      code: |
        {
          "incident_id": "inc-0142",
          "model": "llama3:8b-instruct-q4_K_M",
          "prompt_version": "v3",
          "schema_valid": true,
          "retries": 0,
          "latency_ms": 6840,
          "notified": "slack",
          "analyst_verdict": "accepted"
        }

