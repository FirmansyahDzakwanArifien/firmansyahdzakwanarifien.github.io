---
layout: default
---

{% include lang.html %}

{% assign items = site.album | sort: 'date' | reverse %}

<div class="gphoto-wrapper px-1">
  <header class="gphoto-header mb-4">
    <h1 data-toc-skip>{{ page.title }}</h1>
    {% if page.description %}
      <p class="text-muted">{{ page.description }}</p>
    {% endif %}
  </header>

  <div id="gphotoTimeline"></div>

  <div class="alert alert-info text-center" id="gphotoEmpty" hidden>
    <i class="fas fa-info-circle me-2"></i>
    No photos yet. Check back soon!
  </div>
</div>

<!-- Lightbox -->
<div class="gphoto-lightbox" id="gphotoLightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="gphoto-lightbox-backdrop" data-gphoto-close></div>
  <button type="button" class="gphoto-lb-btn gphoto-lb-close" data-gphoto-close aria-label="Close">
    <i class="fas fa-times"></i>
  </button>
  <button type="button" class="gphoto-lb-btn gphoto-lb-prev" id="gphotoPrev" aria-label="Previous photo">
    <i class="fas fa-chevron-left"></i>
  </button>
  <button type="button" class="gphoto-lb-btn gphoto-lb-next" id="gphotoNext" aria-label="Next photo">
    <i class="fas fa-chevron-right"></i>
  </button>

  <figure class="gphoto-lb-figure" id="gphotoLbFigure">
    <figcaption class="gphoto-lb-info">
      <h3 id="gphotoLbTitle"></h3>
      <p class="gphoto-lb-meta" id="gphotoLbMeta"></p>
      <p class="gphoto-lb-event" id="gphotoLbEvent"></p>
      <p class="gphoto-lb-caption" id="gphotoLbCaption"></p>
    </figcaption>
  </figure>
</div>

<script type="application/json" id="gphoto-data">
[
{% assign printed = false %}
{% for item in items %}
  {% if item.photos %}
    {% assign images = item.photos %}
  {% else %}
    {% assign images = '' | split: '' | push: item.featured_image %}
  {% endif %}
  {% for image in images %}
  {% if image.path %}
  {% if printed %},{% endif %}
  {
    "src": {{ image.path | prepend: item.photos_base | jsonify }},
    "title": {{ item.title | default: '' | jsonify }},
    "alt": {{ image.alt | default: item.title | jsonify }},
    "caption": {{ image.caption | default: '' | jsonify }},
    "date": {{ item.date | date: '%B %-d, %Y' | jsonify }},
    "month": {{ item.date | date: '%B %Y' | jsonify }},
    "location": {{ item.location | default: '' | jsonify }},
    "event": {{ item.event | default: '' | jsonify }}
  }
  {% assign printed = true %}
  {% endif %}
  {% endfor %}
{% endfor %}
]
</script>

<style>
.gphoto-date-heading {
  margin: 2rem 0 0.75rem;
  padding: 0.4rem 0;
  font-size: 1rem;
  font-weight: 600;
  color: var(--heading-color);
  background: var(--main-bg);
}

.gphoto-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 4px;
  margin-bottom: 0.5rem;
}

.gphoto-tile {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 0;
  overflow: hidden;
  cursor: pointer;
  background: var(--card-bg);
  border-radius: 6px;
}

.gphoto-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.25s ease;
}

.gphoto-tile:hover img,
.gphoto-tile:focus-visible img {
  transform: scale(1.06);
}

.gphoto-tile:focus-visible {
  outline: 2px solid var(--link-color);
  outline-offset: 2px;
}

/* Lightbox */
.gphoto-lightbox {
  position: fixed;
  inset: 0;
  z-index: 1100;
  display: none;
  align-items: center;
  justify-content: center;
  touch-action: pan-y;
}

.gphoto-lightbox.is-open {
  display: flex;
}

.gphoto-lightbox-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);
}

.gphoto-lb-figure {
  position: relative;
  z-index: 1;
  max-width: min(92vw, 1100px);
  max-height: 92vh;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.gphoto-lb-figure img {
  max-width: 100%;
  max-height: 72vh;
  object-fit: contain;
  border-radius: 4px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  user-select: none;
  -webkit-user-drag: none;
}

.gphoto-lb-info {
  color: #f1f1f1;
  text-align: center;
  margin-top: 1rem;
  max-width: 640px;
}

.gphoto-lb-info h3 {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0 0 0.3rem;
  color: #fff;
}

.gphoto-lb-meta {
  font-size: 0.82rem;
  opacity: 0.75;
  margin: 0 0 0.4rem;
}

.gphoto-lb-event {
  font-size: 0.85rem;
  font-weight: 500;
  opacity: 0.9;
  margin: 0 0 0.3rem;
}

.gphoto-lb-caption {
  font-size: 0.8rem;
  opacity: 0.65;
  margin: 0;
}

.gphoto-lb-btn {
  position: absolute;
  z-index: 2;
  border: none;
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease;
}

.gphoto-lb-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.gphoto-lb-close {
  top: 1.25rem;
  right: 1.25rem;
}

.gphoto-lb-prev {
  left: 1.25rem;
  top: 50%;
  transform: translateY(-50%);
}

.gphoto-lb-next {
  right: 1.25rem;
  top: 50%;
  transform: translateY(-50%);
}

/* Tablet */
@media (max-width: 1024px) {
  .gphoto-grid {
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  }
}

/* Mobile */
@media (max-width: 768px) {
  .gphoto-grid {
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 3px;
  }

  .gphoto-lb-btn {
    width: 36px;
    height: 36px;
  }

  .gphoto-lb-prev { left: 0.5rem; }
  .gphoto-lb-next { right: 0.5rem; }
  .gphoto-lb-close { top: 0.5rem; right: 0.5rem; }
}
</style>

<script defer src="{{ '/assets/js/custom/photo.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
