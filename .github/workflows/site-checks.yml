# Builds the site and checks it: internal links/images (html-proofer), no inline JavaScript (the CSP
# forbids it), SRI hashes of the pinned jsDelivr libraries, every jsDelivr asset URL, and the assets
# repo size against jsDelivr's 50 MB limit. Runs on every push, weekly, and on demand.
name: Site checks

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC; catches assets removed from the other repo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build JS and CSS assets
        run: |
          npm install
          npm run build:js
          npm run build:css

      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload built site (manual runs only, for local inspection)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1

      - name: Check internal links and images
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Check for inline JavaScript
        if: ${{ !cancelled() }}
        run: python3 tools/check-inline.py _site

      - name: Check Subresource Integrity hashes
        if: ${{ !cancelled() }}
        run: python3 tools/sri.py --check

      - name: Check jsDelivr assets and assets repo size
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/check-assets.sh _site
