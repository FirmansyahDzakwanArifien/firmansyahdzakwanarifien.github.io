# Generates social preview cards (assets/img/og/) for new or retitled posts and projects, commits them,
# and redeploys. Pushes made with GITHUB_TOKEN do not trigger other workflows, so the deploy is dispatched.
name: Social cards

on:
  push:
    branches: ["main"]
    paths: ["_posts/**", "_projects/**", "_data/homelab.yml", "_data/profile.yml", "tools/og-image.py", "tools/hero-iso.png", "tools/fonts/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: og-images
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Generate cards
        run: |
          python3 -m pip install --quiet pillow pyyaml
          python3 tools/og-image.py

      - name: Commit and redeploy when cards changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- assets/img/og)" ]; then
            echo "No card changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/og
          git commit -m "chore: update social preview cards"
          git pull --rebase origin main
          git push
          gh workflow run jekyll.yml --ref main
